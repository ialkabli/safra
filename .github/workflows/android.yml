name: Android checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest lintDebug
      - run: mkdir -p build/rule-checks && javac -encoding UTF-8 --release 17 -d build/rule-checks app/src/main/java/com/iprigner/safra/Rules.java tests/RuleChecks.java && java -cp build/rule-checks com.iprigner.safra.RuleChecks
